name: Windows validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source uploaded
        shell: pwsh
        run: |
          if (!(Test-Path 'pyproject.toml') -or !(Test-Path 'tests')) {
            Write-Error 'Source code has not yet been uploaded; cannot claim validation passed.'
            exit 1
          }
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Syntax check
        run: python -m compileall -q ai_live main.py
